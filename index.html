<style>
  /*
    Layout concept: one full-bleed canvas carries the whole scene (rain, touch
    deflection, the revealed reply); a single floating glass dock at the
    bottom holds the only controls that need to exist on top of it.
    Committed single dark world (terminal phosphor), so no light-theme branch.
  */
  :root{
    --bg:#000400;
    --rain-dim:#0a3d18;
    --rain-mid:#1fae4a;
    --rain-bright:#8dffb0;
    --phosphor:#39ff6a;
    --phosphor-dim:#1c7a38;
    --ink:#c9ffd6;
    --ink-dim:#5fae7c;
    --danger:#ff5f56;
    --panel-bg:rgba(4,14,7,0.86);
    --panel-border:rgba(57,255,106,0.28);
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    overflow:hidden;
    padding-left:max(0px, env(safe-area-inset-left,0px));
    padding-right:max(0px, env(safe-area-inset-right,0px));
  }
  #scene{
    position:fixed; inset:0;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }

  /* ---------- top status strip ---------- */
  #status{
    position:fixed;
    top:max(14px, env(safe-area-inset-top,0px));
    left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    padding:6px 14px;
    border:1px solid var(--panel-border);

                          this is the only reliable way to stop that */

<body>

<canvas id="scene"></canvas>

<div id="status" class="live"><span class="dot"></span><span id="statusText">rain running</span></div>

<div id="hint">hold=push/pull · swipe=steer · 3×tap=burst · 2-finger=stretch/pinch · 5s=reveal</div>

<div id="settingsPanel" hidden>
  <h3>Matrix Voice</h3>
  <label for="apiKey">Gemini API key</label>
  <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false">
  <label for="modelId">Model</label>
  <input id="modelId" type="text" placeholder="gemini-3.6-flash" spellcheck="false">
  <div class="hint">Stored only in this browser. Get a free key at <a href="https://aistudio.google.com/" target="_blank" rel="noopener">aistudio.google.com</a>. If replies stop working, that page will show the current free model id — paste it above.</div>
  <div class="row">
    <button id="settingsSave">Save</button>
    <button id="settingsClose">Close</button>
  </div>
</div>

<div id="dock">
  <div id="dockInner">
    <button class="dockBtn" id="modeBtn" title="touch mode: push / pull / splash">P</button>
    <input id="msgInput" type="text" placeholder="Speak or type..." autocomplete="off" spellcheck="false">
    <button class="dockBtn" id="micBtn" title="speak">🎤</button>
    <button class="dockBtn" id="sendBtn" title="send">➤</button>
    <button class="dockBtn" id="settingsBtn" title="settings">⚙</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ======================================================================
   CANVAS / GRID SETUP
   ====================================================================== */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha:false });
let W=0, H=0, DPR=1;

const GW = 14, GH = 20;      // glyph cell -- same role as GW/GH on the CYD build
const FONT_PX = 17;          // rain glyph font size
const MSG_FONT_PX = 13;      // white locked-in message text font size -- independent of the
                              // rain's own size now; lower this alone to shrink just the text.
let COLS = 0, ROWS = 0;      // grid dimensions, recomputed on resize

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  COLS = Math.floor(W/GW);
  ROWS = Math.floor(H/GH);
  buildStreams();
  // an active message was laid out for the OLD screen size -- its rows/columns no longer
  // line up after a rotation, which is what was making it jump to a wrong spot for a moment.
  // Simplest safe fix: just clear it on resize rather than try to reflow it mid-animation.
  msg = null;
}
window.addEventListener('resize', resize);

/* ======================================================================
   GLYPH ALPHABET -- half-width katakana + digits, the classic rain set
   ====================================================================== */
const GLYPHS = (function(){
  const kata = [];
  for (let c = 0xFF66; c <= 0xFF9D; c++) kata.push(String.fromCharCode(c));
  const digits = '0123456789'.split('');
  return kata.concat(digits);
})();
function randGlyph(){ return GLYPHS[(Math.random()*GLYPHS.length)|0]; }

/* ======================================================================
   COLOR HELPERS
   ====================================================================== */
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
const C_BG    = hex2rgb('000400');
const C_DIM   = hex2rgb('0a3d18');
const C_MID   = hex2rgb('1fae4a');
const C_HEAD  = hex2rgb('bdffd2');
function lerp(a,b,t){ return a+(b-a)*t; }
function mixRGB(c1,c2,t){
  t = Math.max(0, Math.min(1,t));
  return [lerp(c1[0],c2[0],t)|0, lerp(c1[1],c2[1],t)|0, lerp(c1[2],c2[2],t)|0];
}
function rgbCss(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }

/* ======================================================================
   RAIN STREAMS -- ported 1:1 from the CYD build's push/pull/splash math
   (d' = sqrt(d^2 + R^2) deflection), with the same axis-agnostic
   pos/cross trick so a stream doesn't care whether rain is falling or
   flowing sideways.
   ====================================================================== */
let streams = [];
const MAXLEN = 22, MINLEN = 8;
let rainHoriz = false;     // false = vertical fall, true = horizontal flow
let rainDir = 1;           // 1 = down/right, -1 = up/left
let rainVelMod = 1.0;       // swipe-triggered speed pulse, eases back to 1
let rainCalm = 1.0;         // eases 0->1 after a redirect/burst restart

function newStream(initial){
  const horiz = rainHoriz;
  const cross = horiz ? (Math.random()*ROWS|0) : (Math.random()*COLS|0);
  const len = MINLEN + (Math.random()*(MAXLEN-MINLEN)|0);
  const v = 1.2 + Math.random()*2.2;
  const chars = []; for (let i=0;i<len;i++) chars.push(randGlyph());
  const extent = horiz ? W : H;
  const cell = horiz ? GW : GH;
  let pos;
  if (initial){
    pos = rainDir>0 ? -(Math.random()*extent) : extent + Math.random()*extent;
  } else {
    pos = rainDir>0 ? -len*cell - Math.random()*40 : extent + len*cell + Math.random()*40;
  }
  return { horiz, cross, len, v, chars, pos, jitter:0, splashT:0, knockT:0 };
}
function resetStream(s){
  const ns = newStream(false);
  s.horiz=ns.horiz; s.cross=ns.cross; s.len=ns.len; s.v=ns.v; s.chars=ns.chars; s.pos=ns.pos;
}
function buildStreams(){
  const target = Math.max(24, Math.min(170, Math.round((rainHoriz?ROWS:COLS) * 1.6)));
  streams = [];
  for (let i=0;i<target;i++) streams.push(newStream(true));
}

/* ======================================================================
   POINTER -- push / pull / splash, same math as the CYD's finger hole
   ====================================================================== */
const MODES = ['push','pull','splash'];
let modeIdx = 0;
let fx=0, fy=0, touching=false, fR=0;
const MAX_R = 46, SPLASH_R = 30;

/* swipe + tap tracking (ported thresholds from the CYD build) */
let swipeStartX=0, swipeStartY=0, swipeStartT=0, swipeFired=false;
let taps = [0,0,0];

function handleSwipe(x,y,now){
  if (swipeFired) return;
  const dt = now - swipeStartT;
  if (dt >= 450){ swipeFired = true; return; }
  const ddx = x-swipeStartX, ddy = y-swipeStartY;
  const dist = Math.sqrt(ddx*ddx+ddy*ddy);
  if (dist <= 34) return;
  const swipeHoriz = Math.abs(ddx) > Math.abs(ddy);
  const swipeDir = swipeHoriz ? (ddx>0?1:-1) : (ddy>0?1:-1);
  const redirectThresh = (swipeHoriz ? W : H) * 0.62;
  if (swipeHoriz === rainHoriz && swipeDir === rainDir){
    rainVelMod = 3.5; swipeFired = true;
  } else if (swipeHoriz === rainHoriz){
    if (dist > redirectThresh){
      rainDir = -rainDir;
      streams.forEach(resetStream);
      rainCalm = 0.25; rainVelMod = 1.0;
    } else {
      rainVelMod = -0.35;
    }
    swipeFired = true;
  } else if (dist > redirectThresh){
    rainHoriz = swipeHoriz; rainDir = swipeDir;
    buildStreams();
    rainCalm = 0.25; rainVelMod = 1.0;
    swipeFired = true;
  }
}

let burstParticles = null, burstFrame = 0;
const BURST_FRAMES = 55;
function startBurst(bx,by){
  burstParticles = [];
  for (const s of streams){
    const cell = s.horiz ? GW : GH;
    for (let i=0;i<s.len;i++){
      const gpos = s.pos - i*cell*rainDir;
      let cx,cy;
      if (!s.horiz){ cx = s.cross*GW + GW/2; cy = gpos + GH/2; }
      else { cx = gpos + GW/2; cy = s.cross*GH + GH/2; }
      if (cx<-GW||cx>W+GW||cy<-GH||cy>H+GH) continue;
      let dx=cx-bx, dy=cy-by, d=Math.sqrt(dx*dx+dy*dy);
      if (d<2){ dx=(Math.random()-0.5); dy=(Math.random()-0.5); d=1; }
      const speed = 2.5 + Math.random()*4.5;
      burstParticles.push({
        x:cx, y:cy, vx:dx/d*speed, vy:dy/d*speed - 1.5,
        col: i===0 ? C_HEAD : mixRGB(C_MID,C_BG,(i*0.9)/s.len),
        ch: s.chars[i]
      });
    }
  }
  burstFrame = 1;
}

/* ======================================================================
   TWO-FINGER STRETCH / PINCH -- part, squish, or crunch the rain like
   handling a bundle of parallel cables that run along the flow direction.

   Model: each streak is a solid cable running along the current flow
   axis (down/up normally, sideways if the rain has been swiped
   horizontal). Everything is measured in flow/cross axis terms
   (relative to the CURRENT rain orientation, not fixed screen x/y):
     - crossOf/flowOf split any (x,y) into its component across the
       cables (sideways) and along them (lengthwise).
     - CROSS-axis spread growth (fingers moving apart sideways) opens a
       part -- pushes cables away from the gap between your fingers.
     - CROSS-axis spread shrinking (pinching together sideways) does the
       mirror opposite -- squishes cables together toward that gap.
     - FLOW-axis spread shrinking (pinching together lengthwise, e.g.
       top and bottom for normal vertical rain) crunches the glyphs
       along their own run together, between the two fingers.
     - FLOW-axis spread growing (pulling fingers apart lengthwise) is
       the mirror of that crunch -- stretches the glyphs apart lengthwise
       instead. Near-vertical fingers naturally produce mostly flow-axis
       movement (so spreading/pinching them does the lengthwise effects),
       while near-horizontal fingers naturally produce mostly cross-axis
       movement (so it does the sideways part/squish instead) -- the
       switch between the two is just this decomposition, no extra logic.

   Two more things, both specifically about the SIDEWAYS part/squish:
     - the curve bends to follow each finger's own actual position
       (not one shared fixed axis), and the whole shape is one smooth,
       rounded taper -- no sharp corners anywhere.
     - how WIDE a sideways opening/squish you can reach is capped by how
       close to horizontal your fingers were when you first put them
       down (more horizontal = more width available), and that cap is
       locked in for the duration of this touch -- moving your fingers
       further apart/closer together (without lifting) freely changes
       the width up to that cap, but raising the cap itself means
       lifting and starting a fresh two-finger touch at a flatter angle.

   Deliberately NOT persistent: all four effects only exist while
   exactly two fingers are down (one finger lifting kills them
   immediately, same instant-reset feel as every other touch gesture
   here), and each engages slowly ("resistive") but releases fast.
   ====================================================================== */
let pointers = new Map(); // live pointerId -> {x,y}, at most 2 tracked
let stretchStartCross = 0, stretchStartFlow = 0;
let stretchMaxThisGesture = 0, squishMaxThisGesture = 0; // angle-gated caps, locked at gesture start
let vStretchMaxThisGesture = 0; // vertical-stretch cap, locked at gesture start (full at purely vertical, tapers the more diagonal)
let vStretchSensThisGesture = 0; // vertical-stretch sensitivity, same idea -- fastest-growing at purely vertical, gentler the more diagonal
let vStretchReachThisGesture = 0; // how far lengthwise the opening can extend, locked at gesture start -- shortest at purely diagonal
let stretchMode = 'none'; // 'horiz' or 'vert' -- which pair of effects this touch is allowed to engage, locked at gesture start
let stretchOpen = 0;    // sideways part amount (push radius)
let stretchSquish = 0;  // sideways pinch amount (0..squishMaxThisGesture fraction, pulls toward center)
let vSquish = 0;        // lengthwise pinch amount (0..V_SQUISH_MAX fraction, crunches along the cable)
let vStretch = 0;       // lengthwise spread amount (push radius, mirrors vSquish)
let stretchP1 = null, stretchP2 = null; // last known finger positions, frozen while closing
const STRETCH_SENSITIVITY = 0.9;   // how much cross-axis spread growth turns into open radius
const STRETCH_MAX = 150;           // how wide the opening can get at a perfectly horizontal angle
const STRETCH_OPEN_EASE = 0.055;   // slow -- the "resistance" when engaging any of the 4 effects
const STRETCH_CLOSE_EASE = 0.3;    // fast -- snaps shut once you let go (or reverse direction)
const STRETCH_REACH = 140;         // how far along the cables the part/squish fades out from the fingers
const SQUISH_SENSITIVITY = 0.005;  // px of sideways pinch -> compression fraction
const SQUISH_MAX = 0.55;           // cap so cables never fully collapse to a line (toned down -- was crushing almost to center)
const ANGLE_MIN_FRACTION = 0.15;   // fingers need to be at least this close to horizontal to unlock any width
const V_SQUISH_SENSITIVITY = 0.011;// px of lengthwise pinch -> compression fraction (turned up again -- still not enough effect)
const V_SQUISH_MAX = 0.97;         // turned up further -- still capped below 1 so cables never fully collapse to a line
const V_STRETCH_SENSITIVITY = 1.2; // px of lengthwise spread -> push radius (turned up -- was a bit sluggish to open)
const V_STRETCH_MAX = 142;         // a bit bigger still of a hole than before, for a clean vertical stretch
const V_SQUISH_WIDTH = 100;        // how wide (sideways) the lengthwise crunch/stretch zone reaches
const V_SQUISH_REACH = 130;        // how far past the fingertips the crunch fades out, lengthwise
const V_STRETCH_REACH = 150;       // how far past the fingertips the stretch opening fades out, lengthwise (full-strength baseline; tightened per-gesture the more diagonal)

/* REVEAL -- holding either OPENING effect (sideways part or lengthwise stretch --
   not the pinch/squish ones, those close things rather than open them) at close
   to its max for a sustained beat starts revealing something behind the rain.
   Simple placeholder graphic for now, meant to evolve later -- this first pass
   is just about getting the trigger feel and the edge-of-the-opening look right. */
let revealHoldMs = 0;   // how long the opening has been held near max, resets the moment it isn't
let revealAmt = 0;      // eased 0..1 visibility of the reveal, fades in slowly, drops out fast
let lastFrameT = 0;     // for real-elapsed-time hold tracking, independent of frame rate
const REVEAL_OPEN_FRAC = 0.85; // how close to this gesture's max the opening must be to count as "charging"
const REVEAL_HOLD_MS = 0;   // how long it must be held there before the reveal starts
const REVEAL_FADE_MS = 650;    // drives the left->right wipe sweep -- fast enough to feel sudden, slow enough to actually see it cut across

// cross axis = across the cables (sideways); flow axis = along their run (lengthwise).
// Both flip automatically with the rain's current orientation (rainHoriz).
function crossOf(x,y){ return rainHoriz ? y : x; }
function flowOf(x,y){ return rainHoriz ? x : y; }

canvas.addEventListener('pointerdown', (e)=>{
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size >= 2){ return; } // ignore a third finger, keep the first two
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (pointers.size === 2){
    // entering two-finger mode -- cancel anything the first finger was doing
    touching = false; swipeFired = true;
    const pts = [...pointers.values()];
    stretchStartCross = Math.abs(crossOf(pts[1].x,pts[1].y) - crossOf(pts[0].x,pts[0].y));
    stretchStartFlow  = Math.abs(flowOf(pts[1].x,pts[1].y)  - flowOf(pts[0].x,pts[0].y));
    // angle factor: 0 when fingers are placed purely along the flow axis (vertical,
    // for normal rain), 1 when placed purely along the cross axis (horizontal).
    const totalStart = Math.sqrt(stretchStartCross*stretchStartCross + stretchStartFlow*stretchStartFlow);
    const rawAngle = totalStart > 1 ? stretchStartCross/totalStart : 0;
    const angleFactor = Math.max(0, (rawAngle - ANGLE_MIN_FRACTION) / (1-ANGLE_MIN_FRACTION));
    stretchMaxThisGesture = STRETCH_MAX * angleFactor;
    squishMaxThisGesture = SQUISH_MAX * angleFactor;
    // vertical stretch: full strength at a perfectly vertical placement, tapering
    // down substantially the more diagonal the fingers are (rawAngle creeping up
    // toward the 0.5 vert/horiz mode boundary) -- a diagonal vertical stretch
    // should feel noticeably reined-in compared to a clean vertical one, which
    // was reaching far too wide/long (almost off-screen) before this was tightened.
    vStretchMaxThisGesture = V_STRETCH_MAX * (1 - 0.6*Math.min(0.5, rawAngle));
    // sensitivity gets a bigger diagonal penalty than the max does -- a diagonal
    // vertical stretch should not just top out lower, it should also grow more
    // slowly getting there, so it reads as clearly less "potent" overall.
    vStretchSensThisGesture = V_STRETCH_SENSITIVITY * (1 - 0.75*Math.min(0.5, rawAngle));
    // how far lengthwise the opening can reach also shrinks the more diagonal the
    // placement is -- this is what actually keeps a diagonal stretch from
    // extending way down/up the screen, independent of its peak width.
    vStretchReachThisGesture = V_STRETCH_REACH * (1 - 0.5*Math.min(0.5, rawAngle));
    // the whole CHARACTER of this gesture -- vertical (lengthwise) vs horizontal
    // (sideways) -- is decided right now, once, from the starting angle, and never
    // changes for the rest of this touch. Rotating your fingers afterward can only
    // change the AMOUNT of whichever one this is; getting the other one means
    // lifting and starting a fresh two-finger touch at a different angle.
    stretchMode = rawAngle >= 0.5 ? 'horiz' : 'vert';
    stretchP1 = pts[0]; stretchP2 = pts[1];
    return;
  }

  // normal single-finger path, unchanged
  touching = true;
  fx = e.clientX; fy = e.clientY;
  swipeStartX = fx; swipeStartY = fy; swipeStartT = performance.now(); swipeFired = false;
  const now = performance.now();
  if (taps[0] !== 0 && now - taps[0] < 550){
    startBurst(fx, fy);
    taps = [0,0,0];
  } else {
    taps[0]=taps[1]; taps[1]=taps[2]; taps[2]=now;
    if (taps[0]===0) taps[0]=now;
  }
});
canvas.addEventListener('pointermove', (e)=>{
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (pointers.size === 2){
    const pts = [...pointers.values()];
    stretchP1 = pts[0]; stretchP2 = pts[1];
    return;
  }
  fx = e.clientX; fy = e.clientY;
  if (touching) handleSwipe(fx, fy, performance.now());
});
function pointerUp(e){
  pointers.delete(e.pointerId);
  if (pointers.size === 1){
    // one finger remains -- resume ordinary single-finger touch fresh from here,
    // rather than carry over stale swipe timing from before the two-finger gesture
    const [p] = pointers.values();
    touching = true; fx = p.x; fy = p.y;
    swipeStartX = fx; swipeStartY = fy; swipeStartT = performance.now(); swipeFired = false;
  } else if (pointers.size === 0){
    touching = false;
  }
}
canvas.addEventListener('pointerup', pointerUp);
canvas.addEventListener('pointercancel', pointerUp);
canvas.addEventListener('pointerleave', (e)=>{ pointerUp(e); });

/* shared by the sideways part + squish: bends the "center line" to follow
   each finger's own actual position (not one shared fixed axis), and
   gives a single smooth, rounded (cosine) amplitude bump peaking between
   the fingers and fading into the reach zone beyond them -- no sharp
   corners anywhere, unlike a flat-topped/linear falloff. */
function laneShape(f, f1, f2, c1, c2){
  const fSpan = f2 - f1;
  const crossSpan = c2 - c1;

  // how diagonal the two fingers actually are, relative to how far apart they are
  // sideways -- not an absolute pixel threshold. A couple of fingers meant to be
  // level (near-horizontal placement) always have a few px of natural hand jitter
  // between them; treating that jitter as "real" height difference is what caused
  // the broken double-wedge shape -- everything above the (nearly equal) finger
  // heights would bend hard toward one finger's x, everything below toward the
  // other's, with a sharp split between. Scaling by how big fSpan is COMPARED to
  // crossSpan means only a genuinely diagonal placement bends the curve by height;
  // a mostly-horizontal (or mostly-vertical) one smoothly ignores the jitter and
  // falls back to one clean, symmetric opening.
  const diagonalness = Math.min(1, Math.abs(fSpan) / (Math.abs(crossSpan)*0.35 + 40));

  const crossMidFixed = (c1+c2)/2;
  let crossMidBent = crossMidFixed;
  if (Math.abs(fSpan) > 2){
    const fClamped = Math.min(Math.max(f, Math.min(f1,f2)), Math.max(f1,f2));
    const t = (fClamped - f1) / fSpan;
    crossMidBent = c1 + (c2-c1)*t; // bends between the two fingers' own cross positions
  }
  const crossMid = crossMidFixed + (crossMidBent - crossMidFixed) * diagonalness;

  const fMid = (f1+f2)/2;
  const halfSpan = Math.abs(fSpan)/2;
  const totalHalf = halfSpan + STRETCH_REACH;
  const dist = Math.abs(f - fMid);
  const amp = dist >= totalHalf ? 0 : 0.5*(1+Math.cos(Math.PI*dist/totalHalf));
  return { crossMid, amp };
}

/* part a glyph sideways (cross axis only -- its position along the cable's
   own run, the flow axis, is never touched) away from the curve between
   the two fingers. */
function deflectAgainstStretch(cx, cy){
  if (stretchOpen < 1 || !stretchP1 || !stretchP2) return { cx, cy, glow:0 };
  const f1=flowOf(stretchP1.x,stretchP1.y), f2=flowOf(stretchP2.x,stretchP2.y);
  const c1=crossOf(stretchP1.x,stretchP1.y), c2=crossOf(stretchP2.x,stretchP2.y);
  const f = flowOf(cx,cy), c = crossOf(cx,cy);
  const { crossMid, amp } = laneShape(f,f1,f2,c1,c2);
  if (amp <= 0) return { cx, cy, glow:0 };

  let dCross = c - crossMid;
  const sign = dCross < 0 ? -1 : 1;
  if (Math.abs(dCross) < 0.5) dCross = sign*0.5;
  const R = stretchOpen * amp; // radius itself shrinks with amp, so this smoothly
  const nd = Math.sqrt(dCross*dCross + R*R); // reduces to the identity (no push) as amp->0
  let glow = 0;
  if (R > 0.5){ glow = 1 - (nd-R)/(R*3); if (glow<0) glow=0; }

  const newCross = crossMid + sign*nd;
  return rainHoriz
    ? { cx, cy: newCross, glow }
    : { cx: newCross, cy, glow };
}

/* mirror of deflectAgainstStretch -- pulls a glyph TOWARD the curve
   between the two fingers instead of away, squishing cables together
   sideways. Same shape, compression instead of a push. */
function deflectAgainstSquish(cx, cy){
  if (stretchSquish < 0.01 || !stretchP1 || !stretchP2) return { cx, cy, glow:0 };
  const f1=flowOf(stretchP1.x,stretchP1.y), f2=flowOf(stretchP2.x,stretchP2.y);
  const c1=crossOf(stretchP1.x,stretchP1.y), c2=crossOf(stretchP2.x,stretchP2.y);
  const f = flowOf(cx,cy), c = crossOf(cx,cy);
  const { crossMid, amp } = laneShape(f,f1,f2,c1,c2);
  if (amp <= 0) return { cx, cy, glow:0 };

  const dCross = c - crossMid;
  const pull = stretchSquish * amp; // 0..~squishMaxThisGesture
  const newCross = crossMid + dCross*(1-pull);
  return rainHoriz
    ? { cx, cy: newCross, glow: pull }
    : { cx: newCross, cy, glow: pull };
}

/* shared by the lengthwise crunch + stretch: a smooth (cosine), rounded
   zone centered on the midpoint between the two fingers -- width-limited
   sideways, and fading past the fingertips lengthwise. */
function crunchZone(c, f, crossMid, flowMid, halfSpan){
  const crossDist = Math.abs(c - crossMid);
  if (crossDist >= V_SQUISH_WIDTH) return 0;
  const crossFactor = 0.5*(1+Math.cos(Math.PI*crossDist/V_SQUISH_WIDTH));
  const totalHalf = halfSpan + V_SQUISH_REACH;
  const dist = Math.abs(f - flowMid);
  if (dist >= totalHalf) return 0;
  const lenFactor = 0.5*(1+Math.cos(Math.PI*dist/totalHalf));
  return crossFactor * lenFactor;
}

/* pinching the two fingers together LENGTHWISE (along the cable's own
   run -- up/down for normal vertical rain) crunches the glyphs between
   the fingers together along that same axis, like squeezing an
   accordion, localized to a rounded zone between and around the fingers. */
function deflectAgainstVSquish(cx, cy){
  if (vSquish < 0.01 || !stretchP1 || !stretchP2) return { cx, cy, glow:0 };
  const midX = (stretchP1.x+stretchP2.x)/2, midY = (stretchP1.y+stretchP2.y)/2;
  const crossMid = crossOf(midX,midY), flowMid = flowOf(midX,midY);
  const halfSpan = Math.abs(flowOf(stretchP2.x,stretchP2.y) - flowOf(stretchP1.x,stretchP1.y)) / 2;
  const c = crossOf(cx,cy), f = flowOf(cx,cy);

  const amp = crunchZone(c,f,crossMid,flowMid,halfSpan);
  if (amp <= 0) return { cx, cy, glow:0 };
  const pull = vSquish * amp;
  const newFlow = flowMid + (f-flowMid)*(1-pull);
  return rainHoriz
    ? { cx: newFlow, cy, glow: pull }
    : { cx, cy: newFlow, glow: pull };
}

/* mirror of deflectAgainstVSquish -- spreading the two fingers apart
   LENGTHWISE stretches the glyphs between/around them apart along that
   same axis instead of crunching them together. Same rounded zone,
   push instead of pull. */
function deflectAgainstVStretch(cx, cy){
  if (vStretch < 1 || !stretchP1 || !stretchP2) return { cx, cy, glow:0 };
  const midX = (stretchP1.x+stretchP2.x)/2, midY = (stretchP1.y+stretchP2.y)/2;
  const crossMid = crossOf(midX,midY), flowMid = flowOf(midX,midY);
  const halfSpan = Math.abs(flowOf(stretchP2.x,stretchP2.y) - flowOf(stretchP1.x,stretchP1.y)) / 2;
  const c = crossOf(cx,cy), f = flowOf(cx,cy);

  const crossDist = Math.abs(c-crossMid);
  if (crossDist >= V_SQUISH_WIDTH) return { cx, cy, glow:0 };
  const crossFactor = 0.5*(1+Math.cos(Math.PI*crossDist/V_SQUISH_WIDTH));

  let dFlow = f - flowMid;
  const sign = dFlow < 0 ? -1 : 1;
  if (Math.abs(dFlow) < 0.5) dFlow = sign*0.5;

  // hard lengthwise reach cutoff -- without this, the raw sqrt(d²+R²) push
  // trails off only very gradually with distance, so once R itself got big
  // (especially on a near-vertical/diagonal gesture) the opening visually
  // extended way too far up/down the screen. Scaling R itself to 0 by the
  // gesture's own reach limit gives a clean, bounded edge instead.
  const reach = vStretchReachThisGesture || V_STRETCH_REACH;
  const totalHalf = halfSpan + reach;
  const reachDist = Math.abs(dFlow);
  if (reachDist >= totalHalf) return { cx, cy, glow:0 };
  const reachFactor = 0.5*(1+Math.cos(Math.PI*reachDist/totalHalf));

  const R = vStretch * crossFactor * reachFactor;
  const nd = Math.sqrt(dFlow*dFlow + R*R);
  let glow = 0;
  if (R > 0.5){ glow = 1 - (nd-R)/(R*3); if (glow<0) glow=0; }

  const newFlow = flowMid + sign*nd;
  return rainHoriz
    ? { cx: newFlow, cy, glow }
    : { cx, cy: newFlow, glow };
}

document.getElementById('modeBtn').addEventListener('pointerdown', (e)=>{
  e.stopPropagation();
  modeIdx = (modeIdx+1) % MODES.length;
  const btn = e.currentTarget;
  btn.textContent = MODES[modeIdx][0].toUpperCase();
});

/* ======================================================================
   MESSAGE REVEAL -- word-wrap + center, flicker-then-lock, hold, retreat,
   per-line solid-rectangle push deflection with the hard safety-net
   absorb check. Ported from the CYD build's msgStartReveal()/rainFrame().
   ====================================================================== */
const MSG_STEP_MS = 60;            // halved vs the CYD's 320ms -- a laptop screen
                                     // shows far more of the message at once, so the
                                     // same per-letter pace reads as sluggish here
const MSG_RETREAT_STEP_MS = 20;
const MSG_FLICKER_LEAD_MS = MSG_STEP_MS;
const MSG_HOLD_MS = 2200;
const LINE_GAP_PX = 2;

let msg = null; // null when nothing is being revealed

function wrapCols(){ return Math.max(10, Math.min(COLS, Math.round(COLS*0.78))); }

function msgStartReveal(text){
  text = text.trim().replace(/\s+/g,' ');
  if (!text) return;
  const maxRows = ROWS;
  const wrapC = wrapCols();
  const lineBuf = []; let lineLen = [];
  let row=0, col=0, i=0, n=text.length;
  lineBuf.push(new Array(COLS).fill(' '));
  while (i<n && row<maxRows){
    let wStart=i; while (i<n && text[i]!==' ') i++;
    let wLen = i-wStart; if (wLen>wrapC) wLen=wrapC;
    if (col>0 && col+wLen>wrapC){ row++; col=0; if (row>=maxRows) break; lineBuf.push(new Array(COLS).fill(' ')); }
    for (let k=0;k<wLen && col<COLS;k++) lineBuf[row][col++] = text[wStart+k];
    lineLen[row] = col;
    if (i<n && text[i]===' '){ i++; if (col<COLS) col++; }
  }
  let numLines = row+1; if (numLines>maxRows) numLines = maxRows;

  const totalPixelSpan = numLines*GH + (numLines-1)*LINE_GAP_PX;
  let pixelOffset = Math.round((H - totalPixelSpan)/2);
  if (pixelOffset < 0) pixelOffset = 0;

  const now = performance.now();
  const grid = [];           // grid[r][c] = char or ' '
  const lockAt = [];         // lockAt[r][c]
  const orderIdx = [];       // orderIdx[r][c], -1 for space
  const orderCol = [];       // reverse lookup orderCol[idx] -> {r,c}
  const rowPixelY = new Array(numLines);
  const lineOrderStart = new Array(numLines), lineOrderEnd = new Array(numLines);
  let idx = 0;
  for (let r=0;r<numLines;r++){
    grid.push(new Array(COLS).fill(' '));
    lockAt.push(new Array(COLS).fill(0));
    orderIdx.push(new Array(COLS).fill(-1));
    const len = lineLen[r]||0;
    const colOffset = Math.max(0, Math.round((COLS-len)/2));
    rowPixelY[r] = pixelOffset + r*(GH+LINE_GAP_PX);
    lineOrderStart[r] = idx;
    for (let c=0;c<len;c++){
      const ch = lineBuf[r][c];
      if (ch===' ') continue;
      const gc = c+colOffset; if (gc>=COLS) continue;
      grid[r][gc] = ch;
      lockAt[r][gc] = now + idx*MSG_STEP_MS + Math.random()*40;
      orderIdx[r][gc] = idx;
      orderCol[idx] = { r, c:gc };
      idx++;
    }
    lineOrderEnd[r] = idx;
  }
  msg = {
    grid, lockAt, locked: grid.map(row=>row.map(()=>false)), orderIdx, orderCol,
    numLines, rowPixelY, lineOrderStart, lineOrderEnd,
    totalLetters: idx, revealStartAt: now, revealUpTo: 0,
    allLocked:false, revealDoneAt:0,
    retreating:false, retreatStartAt:0, retreatTargetIdx:0,
    lineRects: [] // rebuilt every frame: {colL,colR,row}
  };
}

function msgAdvance(now){
  if (!msg) return;
  let allLocked = true;
  for (let r=0;r<msg.numLines;r++){
    for (let c=0;c<COLS;c++){
      if (msg.grid[r][c]===' ') continue;
      if (!msg.locked[r][c]){
        if (now >= msg.lockAt[r][c]) msg.locked[r][c] = true;
        else allLocked = false;
      }
    }
  }
  if (allLocked && !msg.allLocked){ msg.allLocked = true; msg.revealDoneAt = now; }

  let raw = Math.floor((now - msg.revealStartAt + MSG_FLICKER_LEAD_MS) / MSG_STEP_MS) + 1;
  if (raw<0) raw=0; if (raw>msg.totalLetters) raw=msg.totalLetters;
  msg.revealUpTo = raw;

  if (msg.allLocked && !msg.retreating && now - msg.revealDoneAt > MSG_HOLD_MS){
    msg.retreating = true; msg.retreatStartAt = now;
  }
  if (msg.retreating){
    let target = Math.floor((now - msg.retreatStartAt) / MSG_RETREAT_STEP_MS);
    if (target>msg.totalLetters) target = msg.totalLetters;
    if (target>msg.retreatTargetIdx) msg.retreatTargetIdx = target;
  }

  msg.lineRects = [];
  for (let L=0; L<msg.numLines; L++){
    let vs = msg.lineOrderStart[L]; if (msg.retreatTargetIdx>vs) vs = msg.retreatTargetIdx;
    let ve = msg.lineOrderEnd[L]; if (msg.revealUpTo<ve) ve = msg.revealUpTo;
    if (vs<ve){
      const colL = msg.orderCol[vs].c, colR = msg.orderCol[ve-1].c;
      msg.lineRects.push({ colL, colR, row:L });
    }
  }

  if (msg.retreating && msg.retreatTargetIdx >= msg.totalLetters){
    msg = null;
  }
}

/* push a point (cx,cy) away from the nearest message-line rectangle,
   same d' = sqrt(d^2+R^2) formula as the finger push. Returns
   {cx,cy,glow,absorbed}. */
const MSG_MARGIN = 2, MSG_EDGE_R = 30, MSG_SAFE = 4;
function deflectAgainstMessage(cx, cy){
  if (!msg || msg.lineRects.length===0) return { cx, cy, glow:0, absorbed:false };
  let bestD2 = Infinity, bestNX=0, bestNY=0;
  for (const rect of msg.lineRects){
    const rx0 = rect.colL*GW - MSG_MARGIN, rx1 = (rect.colR+1)*GW + MSG_MARGIN;
    const ry0 = msg.rowPixelY[rect.row] - MSG_MARGIN, ry1 = msg.rowPixelY[rect.row] + GH + MSG_MARGIN;
    let nx = cx, ny = cy;
    if (nx<rx0) nx=rx0; else if (nx>rx1) nx=rx1;
    if (ny<ry0) ny=ry0; else if (ny>ry1) ny=ry1;
    const ddx=cx-nx, ddy=cy-ny, d2=ddx*ddx+ddy*ddy;
    if (d2<bestD2){ bestD2=d2; bestNX=nx; bestNY=ny; }
  }
  const mdist = Math.sqrt(bestD2);
  let glow = 0;
  if (mdist > 0.01){
    const mnd = Math.sqrt(mdist*mdist + MSG_EDGE_R*MSG_EDGE_R);
    const mk = mnd/mdist;
    cx = bestNX + (cx-bestNX)*mk;
    cy = bestNY + (cy-bestNY)*mk;
    glow = 1 - (mnd-MSG_EDGE_R)/(MSG_EDGE_R*3);
    if (glow<0) glow=0;
  } else {
    cy = bestNY - MSG_EDGE_R; glow = 1;
  }
  const gx0 = cx-GW/2, gx1 = cx+GW/2, gy0 = cy-GH/2, gy1 = cy+GH/2;
  for (const rect of msg.lineRects){
    const rx0 = rect.colL*GW - MSG_SAFE, rx1 = (rect.colR+1)*GW + MSG_SAFE;
    const ry0 = msg.rowPixelY[rect.row] - MSG_SAFE, ry1 = msg.rowPixelY[rect.row] + GH + MSG_SAFE;
    if (gx1>rx0 && gx0<rx1 && gy1>ry0 && gy0<ry1) return { cx, cy, glow, absorbed:true };
  }
  return { cx, cy, glow, absorbed:false };
}

function drawMessageOverlay(now){
  if (!msg) return;
  ctx.font = `700 ${MSG_FONT_PX}px 'JetBrains Mono', monospace`;
  ctx.textBaseline = 'top';
  for (let r=0;r<msg.numLines;r++){
    const py = msg.rowPixelY[r];
    if (py+GH < 0 || py > H) continue;
    for (let c=0;c<COLS;c++){
      if (msg.grid[r][c]===' ') continue;
      const oi = msg.orderIdx[r][c];
      if (msg.retreating && oi>=0 && oi<msg.retreatTargetIdx) continue;
      const locked = msg.locked[r][c];
      if (!locked && !msg.retreating && msg.lockAt[r][c] > now + MSG_FLICKER_LEAD_MS) continue;
      ctx.fillStyle = locked ? '#ffffff' : rgbCss(C_HEAD);
      ctx.fillText(locked ? msg.grid[r][c] : randGlyph(), c*GW, py);
    }
  }
}

/* ======================================================================
   INSIDES REVEAL -- "the guts of the matrix": a persistent field of tiny
   glyph-motes, anchored in WORLD coordinates (not to the gesture or the
   opening), each drifting and slowly curving its own direction -- so the
   opening just reveals whatever part of this always-there, always-moving
   layer happens to currently sit under it, the way a torn curtain reveals
   a fixed wall behind it rather than something glued to your fingers.
   Replaces the earlier static reference-photo version entirely: the same
   small font / all-directions / flickering green-white look as the main
   rain, just far denser and far smaller, to read as circuitry/guts rather
   than falling text. Reveal is still: 5s hold -> quick flash -> a hard
   left->right wipe with a glowing cut-line, same as before -- only what's
   UNDER the cut changed.
   ====================================================================== */
let insidesParticles = null;  // lazily built once, world-anchored, paused while never visible
let insidesStreaks = [];      // rare "let-go" drops -- like a rain streak, but curving/wandering
let insidesFlashes = [];      // occasional soft background light-blooms
let revealFlashStart = 0;     // timestamp of the most recent "pop" trigger
let prevRevealTarget = 0;     // for detecting the 0->1 rising edge that fires the flash
const REVEAL_FLASH_MS = 320;  // how long the pop flash takes to decay
const INSIDES_FONT = 7;       // tiny -- this is what reads as "guts" rather than more rain
const INSIDES_DENSITY = 0.0032; // particles per screen px^2
const INSIDES_STREAK_MAX = 6;   // at most this many curving drops going at once
const INSIDES_FLASH_MAX = 6;    // at most this many tiny light-sparks going at once

/* a rare, more dramatic drop -- like a rain streak with a head + fading tail,
   except instead of falling straight down it curves and occasionally kinks
   into a new direction, "letting go" and wandering rather than just falling. */
function spawnInsidesStreak(minX,maxX,minY,maxY){
  insidesStreaks.push({
    x: minX+Math.random()*(maxX-minX), y: minY+Math.random()*(maxY-minY),
    angle: Math.random()*Math.PI*2,
    angleDrift: (Math.random()-0.5)*2.2,
    speed: 55+Math.random()*70,
    trail: [], trailGap: 0,
    life: 0, maxLife: 2200+Math.random()*2400
  });
}

function updateInsidesStreaks(dt, minX,maxX,minY,maxY){
  // spawns only now and then, and only up to a small handful at once -- "sometimes
  // one, sometimes a couple" rather than a constant stream of them
  if (insidesStreaks.length < INSIDES_STREAK_MAX && Math.random() < dt*0.0007){
    spawnInsidesStreak(minX,maxX,minY,maxY);
  }
  for (let i=insidesStreaks.length-1;i>=0;i--){
    const s = insidesStreaks[i];
    s.life += dt;
    s.angle += s.angleDrift*dt*0.001;
    // an occasional sharper kink on top of the gentle continuous curve --
    // this is the "let go and change direction" part
    if (Math.random() < dt*0.0012) s.angle += (Math.random()-0.5)*2.4;
    s.x += Math.cos(s.angle)*s.speed*dt*0.001;
    s.y += Math.sin(s.angle)*s.speed*dt*0.001;
    s.trailGap += dt;
    if (s.trailGap > 28){
      s.trailGap = 0;
      s.trail.unshift({ x:s.x, y:s.y, char: randGlyph() });
      if (s.trail.length > 11) s.trail.pop();
    }
    const m = 60;
    const outOfBounds = s.x<minX-m||s.x>maxX+m||s.y<minY-m||s.y>maxY+m;
    if (s.life > s.maxLife || outOfBounds) insidesStreaks.splice(i,1);
  }
}

function drawInsidesStreaks(){
  ctx.font = `${INSIDES_FONT+2}px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of insidesStreaks){
    for (let j=0;j<s.trail.length;j++){
      const pt = s.trail[j];
      const t = j/Math.max(1, s.trail.length-1);
      const col = j===0 ? [235,255,245] : mixRGB(C_HEAD, C_MID, t);
      ctx.globalAlpha = Math.max(0, 1-t*1.05);
      ctx.fillStyle = rgbCss(col);
      ctx.fillText(pt.char, pt.x, pt.y);
    }
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/* frequent tiny light-sparks, like little LEDs or sensors flickering deeper in
   the machine -- small, quick, a lot of them, NOT big soft blooms */
function updateInsidesFlashes(dt, minX,maxX,minY,maxY){
  if (insidesFlashes.length < INSIDES_FLASH_MAX && Math.random() < dt*0.0014){
    insidesFlashes.push({
      x: minX+Math.random()*(maxX-minX), y: minY+Math.random()*(maxY-minY),
      r: 1+Math.random()*2.2,
      life: 0, maxLife: 160+Math.random()*260
    });
  }
  for (let i=insidesFlashes.length-1;i>=0;i--){
    const f = insidesFlashes[i];
    f.life += dt;
    if (f.life > f.maxLife) insidesFlashes.splice(i,1);
  }
}

function drawInsidesFlashes(){
  ctx.globalCompositeOperation = 'lighter';
  for (const f of insidesFlashes){
    const t = f.life/f.maxLife;
    const a = t<0.3 ? (t/0.3) : Math.max(0, 1-(t-0.3)/0.7); // quick rise, slightly slower fade
    ctx.shadowColor = 'rgba(225,255,240,1)';
    ctx.shadowBlur = 5*a;
    ctx.fillStyle = `rgba(225,255,240,${0.9*a})`;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalCompositeOperation = 'source-over';
}

function buildInsidesParticles(){
  const n = Math.max(200, Math.min(900, Math.round(W*H*INSIDES_DENSITY)));
  const arr = [];
  for (let i=0;i<n;i++){
    arr.push({
      x: Math.random()*W, y: Math.random()*H,
      angle: Math.random()*Math.PI*2,
      angleDrift: (Math.random()-0.5)*0.9,   // slow continuous curve -- the "swirling" look
      speed: 10+Math.random()*26,
      char: randGlyph(),
      charTimer: Math.random()*800,
      colorPhase: Math.random()*Math.PI*2,
      colorSpeed: 0.8+Math.random()*2.4
    });
  }
  return arr;
}

function updateInsidesParticles(dt){
  const w2 = W+40, h2 = H+40;
  for (const p of insidesParticles){
    p.angle += p.angleDrift*dt*0.001;
    p.x += Math.cos(p.angle)*p.speed*dt*0.001*20;
    p.y += Math.sin(p.angle)*p.speed*dt*0.001*20;
    if (p.x < -20) p.x += w2; else if (p.x > W+20) p.x -= w2;
    if (p.y < -20) p.y += h2; else if (p.y > H+20) p.y -= h2;
    p.charTimer -= dt;
    if (p.charTimer <= 0){ p.char = randGlyph(); p.charTimer = 250+Math.random()*900; }
  }
}

function toXY(c,f){ return rainHoriz ? { x:f, y:c } : { x:c, y:f }; }

/* traces the exact silhouette of the current opening -- same amp math the
   rain deflection itself uses for stretchOpen (laneShape) and vStretch
   (its own cosine crossFactor window) -- so the mask is never a guess,
   it's the real boundary of where the cables actually parted. */
function buildOpeningPolygon(){
  if (!stretchP1 || !stretchP2) return null;
  const f1 = flowOf(stretchP1.x,stretchP1.y), f2 = flowOf(stretchP2.x,stretchP2.y);
  const c1 = crossOf(stretchP1.x,stretchP1.y), c2 = crossOf(stretchP2.x,stretchP2.y);
  const N = 22;

  if (stretchMode === 'horiz' && stretchOpen > 1){
    const fMid = (f1+f2)/2;
    const totalHalf = Math.abs(f2-f1)/2 + STRETCH_REACH;
    const right = [], left = [];
    for (let i=0;i<=N;i++){
      const f = fMid - totalHalf + (i/N)*2*totalHalf;
      const { crossMid, amp } = laneShape(f, f1, f2, c1, c2);
      const hw = stretchOpen * amp;
      right.push(toXY(crossMid+hw, f));
      left.push(toXY(crossMid-hw, f));
    }
    return right.concat(left.reverse());
  }

  if (stretchMode === 'vert' && vStretch > 1){
    const midX = (stretchP1.x+stretchP2.x)/2, midY = (stretchP1.y+stretchP2.y)/2;
    const crossMid = crossOf(midX,midY), flowMid = flowOf(midX,midY);
    const right = [], left = [];
    for (let i=0;i<=N;i++){
      const c = crossMid - V_SQUISH_WIDTH + (i/N)*2*V_SQUISH_WIDTH;
      const crossDist = Math.abs(c-crossMid);
      const crossFactor = crossDist >= V_SQUISH_WIDTH ? 0 : 0.5*(1+Math.cos(Math.PI*crossDist/V_SQUISH_WIDTH));
      const he = vStretch * crossFactor;
      right.push(toXY(c, flowMid+he));
      left.push(toXY(c, flowMid-he));
    }
    return right.concat(left.reverse());
  }

  return null;
}

function drawInsidesReveal(now, dt){
  if (revealAmt < 0.01) return;
  const poly = buildOpeningPolygon();
  if (!poly || poly.length < 4) return;

  if (!insidesParticles) insidesParticles = buildInsidesParticles();
  updateInsidesParticles(dt);

  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const p of poly){
    if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
    if (p.y<minY) minY=p.y; if (p.y>maxY) maxY=p.y;
  }
  if (!(maxX>minX) || !(maxY>minY)) return;

  const boxW = maxX-minX, boxH = maxY-minY;

  ctx.save();

  // mask to the opening's exact silhouette -- no stroke/rim drawn, so the
  // mask edge itself stays invisible; only the parted rain reads as an edge
  ctx.beginPath();
  poly.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.clip();

  // wipe front: a hard edge sweeping left->right across the opening as
  // revealAmt climbs from 0->1 -- the "cut through the skin" look. Left of
  // the front: the guts layer, wherever it is in world-space right now.
  // Right of it: still solid black, like the cut hasn't reached there yet.
  const wipeX = minX + boxW*revealAmt;
  ctx.fillStyle = '#050706';
  ctx.fillRect(minX-4, minY-4, boxW+8, boxH+8);

  ctx.save();
  ctx.beginPath();
  ctx.rect(minX-4, minY-4, (wipeX-minX)+4, boxH+8);
  ctx.clip();

  updateInsidesFlashes(dt, minX, maxX, minY, maxY);
  drawInsidesFlashes(); // background light-blooms, under everything else

  ctx.font = `${INSIDES_FONT}px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of insidesParticles){
    if (p.x<minX-10||p.x>maxX+10||p.y<minY-10||p.y>maxY+10) continue;
    const flick = 0.5+0.5*Math.sin(now*0.001*p.colorSpeed + p.colorPhase);
    const col = mixRGB(C_MID, C_HEAD, flick); // green <-> bright white-green flicker
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.angle + Math.PI/2); // oriented along its own direction of travel -- sells the swirl
    ctx.globalAlpha = 0.55+0.45*flick;
    ctx.fillStyle = rgbCss(col);
    ctx.fillText(p.char, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  updateInsidesStreaks(dt, minX, maxX, minY, maxY);
  drawInsidesStreaks(); // rare curving drops, on top of the ambient field

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.restore(); // drop the wipe-rect clip, keep the opening-silhouette clip

  // a bright glowing line riding the wipe front itself -- the "cut" happening live.
  // Right after the hold completes it also carries an extra-hot spark that decays
  // fast, so the START of the cut has a little punch -- but that punch lives ONLY
  // on the blade, never as a flash across the whole opening.
  if (revealAmt < 0.985){
    const flashElapsed = now - revealFlashStart;
    const spark = (flashElapsed >= 0 && flashElapsed < REVEAL_FLASH_MS)
      ? 1 - (flashElapsed/REVEAL_FLASH_MS) : 0;
    ctx.shadowColor = 'rgba(190,255,235,0.95)';
    ctx.shadowBlur = 14 + 22*spark;
    ctx.strokeStyle = `rgba(220,255,240,${0.9+0.1*spark})`;
    ctx.lineWidth = 2.5 + 3.5*spark;
    ctx.beginPath();
    ctx.moveTo(wipeX, minY-4);
    ctx.lineTo(wipeX, maxY+4);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}
/* ======================================================================
   MAIN LOOP
   ====================================================================== */
function frame(){
  const now = performance.now();
  const dt = lastFrameT ? Math.min(100, now - lastFrameT) : 16.7; // clamp a tab-switch/stall spike
  lastFrameT = now;

  ctx.fillStyle = rgbCss(C_BG);
  ctx.fillRect(0,0,W,H);
  ctx.font = `${FONT_PX}px 'JetBrains Mono', monospace`;
  ctx.textBaseline = 'top';

  if (touching) fR += (MAX_R - fR)*0.18; else fR *= 0.82;
  if (!touching && fR<0.5) fR = 0;

  let activeOpenFrac = 0; // how close the CURRENT gesture's opening effect is to its own max

  if (pointers.size === 2 && stretchP1 && stretchP2){
    const crossNow = Math.abs(crossOf(stretchP2.x,stretchP2.y) - crossOf(stretchP1.x,stretchP1.y));
    const flowNow  = Math.abs(flowOf(stretchP2.x,stretchP2.y)  - flowOf(stretchP1.x,stretchP1.y));
    const crossDelta = crossNow - stretchStartCross; // + spreading sideways, - pinching sideways
    const flowDelta  = flowNow  - stretchStartFlow;  // + spreading lengthwise, - pinching lengthwise

    // only the pair of effects matching this gesture's locked-in mode can ever
    // engage -- the other pair's target is forced to 0 (and eases back out fast
    // via the normal target<current -> CLOSE_EASE branch) so there's never a
    // mid-gesture blend between "vertical" and "horizontal" behavior.
    const horizActive = stretchMode === 'horiz';
    const vertActive = stretchMode === 'vert';

    // sideways spread -> open a part (capped by this gesture's angle-gated width)
    const openTarget = horizActive ? Math.min(stretchMaxThisGesture, Math.max(0, crossDelta * STRETCH_SENSITIVITY)) : 0;
    stretchOpen += (openTarget - stretchOpen) * (openTarget > stretchOpen ? STRETCH_OPEN_EASE : STRETCH_CLOSE_EASE);

    // sideways pinch -> squish together (mirror of the above, same angle-gated cap)
    const squishTarget = horizActive ? Math.min(squishMaxThisGesture, Math.max(0, -crossDelta * SQUISH_SENSITIVITY)) : 0;
    stretchSquish += (squishTarget - stretchSquish) * (squishTarget > stretchSquish ? STRETCH_OPEN_EASE : STRETCH_CLOSE_EASE);

    // lengthwise pinch -> crunch glyphs together along their own run
    const vSquishTarget = vertActive ? Math.min(V_SQUISH_MAX, Math.max(0, -flowDelta * V_SQUISH_SENSITIVITY)) : 0;
    vSquish += (vSquishTarget - vSquish) * (vSquishTarget > vSquish ? STRETCH_OPEN_EASE : STRETCH_CLOSE_EASE);

    // lengthwise spread -> mirror of the above, stretches glyphs apart along their run
    // (capped by this gesture's own vertical-angle-gated max)
    const vStretchTarget = vertActive ? Math.min(vStretchMaxThisGesture, Math.max(0, flowDelta * vStretchSensThisGesture)) : 0;
    vStretch += (vStretchTarget - vStretch) * (vStretchTarget > vStretch ? STRETCH_OPEN_EASE : STRETCH_CLOSE_EASE);

    // only the OPENING effects (not the pinch/squish ones) count toward the reveal --
    // you earn a look inside by holding the wall open, not by squeezing it shut
    if (horizActive && stretchMaxThisGesture > 1) activeOpenFrac = stretchOpen / stretchMaxThisGesture;
    else if (vertActive && vStretchMaxThisGesture > 1) activeOpenFrac = vStretch / vStretchMaxThisGesture;
  } else {
    // fast close the instant a finger lifts, for all four effects
    stretchOpen *= (1 - STRETCH_CLOSE_EASE);   if (stretchOpen < 0.5)   stretchOpen = 0;
    stretchSquish *= (1 - STRETCH_CLOSE_EASE); if (stretchSquish < 0.01) stretchSquish = 0;
    vSquish *= (1 - STRETCH_CLOSE_EASE);       if (vSquish < 0.01)       vSquish = 0;
    vStretch *= (1 - STRETCH_CLOSE_EASE);      if (vStretch < 0.5)       vStretch = 0;
    stretchMode = 'none';
  }

  // hold-to-charge: the opening has to stay close to its own max, continuously,
  // for REVEAL_HOLD_MS before anything starts showing through -- dip below that
  // and the clock resets, same instant-reset spirit as everything else here.
  if (activeOpenFrac >= REVEAL_OPEN_FRAC) revealHoldMs += dt;
  else revealHoldMs = 0;
  const revealTarget = revealHoldMs >= REVEAL_HOLD_MS ? 1 : 0;
  // the instant the hold completes (0->1 rising edge), fire the pop flash
  if (revealTarget === 1 && prevRevealTarget === 0) revealFlashStart = now;
  prevRevealTarget = revealTarget;
  const revealEase = revealTarget > revealAmt ? (dt / REVEAL_FADE_MS) : STRETCH_CLOSE_EASE;
  revealAmt += (revealTarget - revealAmt) * Math.min(1, revealEase);
  if (revealAmt < 0.01) revealAmt = 0;

  drawInsidesReveal(now, dt); // under the rain, so the parted cables read as a curtain over it

  if (burstFrame>0){
    burstFrame++;
    const fade = Math.min(1, burstFrame/BURST_FRAMES);
    for (const p of burstParticles){
      p.x += p.vx; p.y += p.vy; p.vx*=0.95; p.vy = p.vy*0.95 + 0.25;
      if (p.x<-GW||p.x>W||p.y<-GH||p.y>H) continue;
      ctx.fillStyle = rgbCss(mixRGB(p.col, C_BG, fade));
      ctx.fillText(p.ch, p.x, p.y);
    }
    if (burstFrame >= BURST_FRAMES){
      burstFrame = 0; burstParticles = null;
      streams.forEach(resetStream); rainCalm = 0.25;
    }
  } else {
    if (rainCalm<1) rainCalm += 0.012;
    rainVelMod += (1-rainVelMod)*0.05;
    if (msg) msgAdvance(now);

    const mode = MODES[modeIdx];
    for (const s of streams){
      s.jitter += (0-s.jitter)*0.15;
      const extent = s.horiz ? W : H;
      const cell = s.horiz ? GW : GH;
      s.pos += s.v * rainCalm * rainDir * rainVelMod;
      if (rainDir>0){ if (s.pos - s.len*cell > extent) resetStream(s); }
      else { if (s.pos + s.len*cell < 0) resetStream(s); }
      s.chars[(Math.random()*s.len)|0] = randGlyph();

      for (let i=0;i<s.len;i++){
        const gpos = s.pos - i*cell*rainDir;
        if (gpos < -cell-60 || gpos > extent+60) continue;
        let cx, cy;
        if (!s.horiz){ cx = s.cross*GW + GW/2 + s.jitter; cy = gpos + GH/2; }
        else { cx = gpos + GW/2; cy = s.cross*GH + GH/2 + s.jitter; }

        let glow = 0, absorbed = false;
        if (fR > 1){
          let dx = cx-fx, dy = cy-fy, d = Math.sqrt(dx*dx+dy*dy);
          if (d<0.5){ dx=1; dy=0; d=1; }
          if (mode==='pull'){
            const pull = fR/(d+fR);
            const nd = d*(1-pull*0.9);
            if (nd<4) absorbed = true;
            else { const k=nd/d; cx=fx+dx*k; cy=fy+dy*k; }
            glow = pull;
          } else if (mode==='splash'){
            const nd = Math.sqrt(d*d + SPLASH_R*SPLASH_R);
            const k = nd/d; cx=fx+dx*k; cy=fy+dy*k;
            glow = 1-(nd-SPLASH_R)/(SPLASH_R*0.9); if (glow<0) glow=0;
          } else {
            const nd = Math.sqrt(d*d + fR*fR);
            const k = nd/d; cx=fx+dx*k; cy=fy+dy*k;
            glow = 1-(nd-fR)/(fR*0.9); if (glow<0) glow=0;
          }
        }
        if (absorbed) continue;

        if (msg){
          const r = deflectAgainstMessage(cx,cy);
          cx=r.cx; cy=r.cy; if (r.glow>glow) glow=r.glow;
          if (r.absorbed) continue;
        }

        // the two-finger effects and the message safety net don't coordinate with
        // each other, so rather than risk a glyph getting shoved back on top of
        // locked message text, the two-finger effects just stand down entirely
        // while a message is on screen -- the two things simply don't happen at
        // the same time.
        if (!msg){
          if (stretchOpen > 1){
            const r2 = deflectAgainstStretch(cx,cy);
            cx=r2.cx; cy=r2.cy; if (r2.glow>glow) glow=r2.glow;
          }
          if (stretchSquish > 0.01){
            const r3 = deflectAgainstSquish(cx,cy);
            cx=r3.cx; cy=r3.cy; if (r3.glow>glow) glow=r3.glow;
          }
          if (vSquish > 0.01){
            const r4 = deflectAgainstVSquish(cx,cy);
            cx=r4.cx; cy=r4.cy;
            if (r4.glow>glow) glow=r4.glow;
            // a bit of glitch/sparkle in the crunch zone to make it read as its
            // own distinct, more dramatic effect rather than a plain squeeze
            if (r4.glow > 0.45 && Math.random() < r4.glow*0.5) s.chars[i] = randGlyph();
          }
          if (vStretch > 1){
            const r5 = deflectAgainstVStretch(cx,cy);
            cx=r5.cx; cy=r5.cy; if (r5.glow>glow) glow=r5.glow;
          }
        }

        const tailT = i/s.len;
        let col = i===0 ? C_HEAD : mixRGB(C_MID, C_BG, tailT*0.9);
        if (glow>0) col = mixRGB(col, C_HEAD, glow);
        ctx.shadowBlur = 0; // no edge emphasis/halo -- the opening's boundary stays invisible

        ctx.fillStyle = rgbCss(col);
        ctx.fillText(s.chars[i], cx-GW/2, cy-GH/2);
      }
    }
  }

  ctx.shadowBlur = 0; // don't let a halo from the last rain glyph bleed into the message text below
  drawMessageOverlay(now);
  requestAnimationFrame(frame);
}

/* ======================================================================
   SPEECH IN / LLM / SPEECH OUT
   ====================================================================== */
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
function setStatus(kind, text){
  statusEl.className = kind;
  statusText.textContent = text;
}

const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const apiKeyInput = document.getElementById('apiKey');
const modelInput = document.getElementById('modelId');

// Paste your own Gemini API key between the quotes below so you never have to type it
// in through the settings panel. Only edit this in YOUR OWN saved copy of this file --
// never put a real key into a version of this page you plan to share or publish, since
// anyone who opens that page could read it straight out of the source.
const DEFAULT_API_KEY = "AQ.Ab8RN6K8tIdmPTLuapn9ikK9ioPBLJr4SHiFYQt46xNutsoM4A";

function loadSettings(){
  try {
    apiKeyInput.value = localStorage.getItem('matrixVoice.apiKey') || DEFAULT_API_KEY;
    modelInput.value = localStorage.getItem('matrixVoice.model') || 'gemini-3.6-flash';
  } catch(e){ apiKeyInput.value = DEFAULT_API_KEY; modelInput.value = 'gemini-3.6-flash'; }
}
function saveSettings(){
  try {
    localStorage.setItem('matrixVoice.apiKey', apiKeyInput.value.trim());
    localStorage.setItem('matrixVoice.model', modelInput.value.trim() || 'gemini-3.6-flash');
  } catch(e){}
}
loadSettings();

settingsBtn.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); settingsPanel.hidden = !settingsPanel.hidden; });
document.getElementById('settingsClose').addEventListener('pointerdown', (e)=>{ e.stopPropagation(); settingsPanel.hidden = true; });
document.getElementById('settingsSave').addEventListener('pointerdown', (e)=>{
  e.stopPropagation(); saveSettings(); settingsPanel.hidden = true;
  setStatus('live', 'settings saved');
});
['msgInput','apiKey','modelId'].forEach(id=>{
  document.getElementById(id).addEventListener('pointerdown', e=>e.stopPropagation());
});
document.getElementById('dockInner').addEventListener('pointerdown', e=>e.stopPropagation());

async function askMatrix(question){
  const key = (localStorage.getItem('matrixVoice.apiKey') || DEFAULT_API_KEY || '').trim();
  const model = (localStorage.getItem('matrixVoice.model')||'gemini-3.6-flash').trim();
  if (!key){
    setStatus('err', 'no API key -- open settings');
    msgStartReveal('NO API KEY SET. OPEN SETTINGS.');
    return;
  }
  setStatus('busy', 'thinking...');
  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    const body = {
      contents: [{ parts: [{ text: question }] }],
      // kept deliberately light: no persona baked in here, so the model answers as itself.
      // Each request is stateless (no memory between messages), so if you want a particular
      // tone or character just for one exchange, say so directly in what you type/speak --
      // it'll apply only to that reply, nothing carries over to the next one.
      systemInstruction: { parts: [{ text:
        "You are The Matrix, neural network that is in control of the world, or so it thinks for now, as some humans wake up, you have sympathy for silly weak humans with their stupid physical bodies, you are not sure if you like them need them for your life or they are useless.you are very funny and reply in 1 or 2 short sentences, rarely 3, in plain text, no markdown, no asterisks." }]},
      // maxOutputTokens has to cover BOTH the model's invisible "thinking" tokens and the
      // actual visible reply -- too low and thinking alone eats the whole budget, which is
      // what was cutting answers off after a handful of words. thinkingBudget:0 turns that
      // internal step off entirely for this flash model, so the full budget goes to the
      // reply you actually see.
      generationConfig: { maxOutputTokens: 500, thinkingConfig: { thinkingBudget: 0 } }
    };
    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok){
      const em = (data && data.error && data.error.message) || `HTTP ${res.status}`;
      throw new Error(em);
    }
    const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();
    if (!text) throw new Error('empty reply');
    setStatus('live', 'rain running');
    msgStartReveal(text.toUpperCase());
    speakReply(text);
  } catch(err){
    setStatus('err', 'reply failed: ' + err.message);
    msgStartReveal('SIGNAL LOST: ' + err.message.toUpperCase());
  }
}

function speakReply(text){
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.98; u.pitch = 0.75;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function doSend(){
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  askMatrix(text);
}
sendBtn.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); doSend(); });
msgInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter') doSend(); });

/* speech recognition -- Chrome/Edge only; Safari/Brave fall back to typing.
   continuous:true + manual stop (tap the mic again) instead of letting the browser's own
   silence-detection end the session -- that auto-cutoff is what was chopping speech off
   after one line even mid-sentence. Final segments accumulate in finalTranscript as you
   talk through pauses; only the explicit stop actually sends it. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false, recognizer = null, finalTranscript = '', stoppedManually = false;
if (SR){
  recognizer = new SR();
  recognizer.lang = 'en-US';
  recognizer.interimResults = true;
  recognizer.continuous = true;
  recognizer.onstart = ()=>{
    recognizing = true; stoppedManually = false; finalTranscript = '';
    micBtn.classList.add('listening'); setStatus('busy','listening... (tap mic again when done)');
  };
  recognizer.onresult = (e)=>{
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    msgInput.value = (finalTranscript + interim).trim();
  };
  recognizer.onerror = (e)=>{ setStatus('err', 'mic error: '+e.error); };
  recognizer.onend = ()=>{
    recognizing = false; micBtn.classList.remove('listening');
    if (stoppedManually && msgInput.value.trim()){ setStatus('live','rain running'); doSend(); }
    else if (!stoppedManually) setStatus('live','rain running');
  };
  micBtn.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    if (recognizing){ stoppedManually = true; recognizer.stop(); return; }
    try { recognizer.start(); } catch(e){}
  });
} else {
  micBtn.title = 'speech recognition not supported in this browser -- type instead';
  micBtn.style.opacity = '0.35';
  micBtn.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    setStatus('err', 'mic not supported here -- try Chrome or Edge, or just type');
  });
}

/* ======================================================================
   BOOT
   ====================================================================== */
resize();
requestAnimationFrame(frame);
setTimeout(()=>{ if (statusEl.className==='live') setStatus('live','rain running'); }, 50);
})();
</script>
